[metadata]
name = promptwars-sentinel
version = 1.1.0
description = AI Prompt Security Auditor & Battle Arena
author = Tharundass R
license = MIT

[options]
packages = find:
python_requires = >=3.9

[options.packages.find]
exclude =
    tests*

[coverage:run]
branch = True
source = core,server

[coverage:report]
show_missing = True
skip_covered = True
fail_under = 90
